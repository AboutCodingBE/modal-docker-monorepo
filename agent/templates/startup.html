<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODAL — Opstarten</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f0f2f5;
      color: #111827;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .startup-container { width: 600px; max-width: 100%; }

    /* ── Header ── */
    .startup-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      background: #1a2744;
      border-radius: 10px;
      padding: 18px 20px;
      color: #fff;
    }

    .startup-logo {
      width: 42px; height: 42px;
      background: #3b6ef5;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px;
      flex-shrink: 0;
    }

    .startup-text { flex: 1; min-width: 0; }

    .startup-title {
      font-size: 18px; font-weight: 700;
      letter-spacing: 0.05em; margin-bottom: 2px;
    }

    .startup-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.4; }

    /* ── Phase list ── */
    .phase-list {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .phase-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid #f3f4f6;
    }
    .phase-row:last-child { border-bottom: none; }

    /* ── Status icons ── */
    .status-icon {
      width: 22px; height: 22px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%; background: #d1d5db;
    }

    .status-spinner {
      width: 16px; height: 16px;
      border: 2px solid #bfdbfe;
      border-top-color: #3b6ef5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .status-check {
      width: 18px; height: 18px;
      border-radius: 50%; background: #22c55e;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; font-weight: 700;
    }

    .status-cross {
      width: 18px; height: 18px;
      border-radius: 50%; background: #ef4444;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; font-weight: 700;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .phase-label { flex: 1; font-size: 13px; font-weight: 600; color: #111827; }

    .phase-detail { font-size: 11px; color: #6b7280; text-align: right; flex-shrink: 0; }

    /* ── Error block ── */
    .error-block {
      padding: 0 18px 14px 52px;
      border-bottom: 1px solid #f3f4f6;
    }

    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px; color: #991b1b;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .remediation { font-size: 12px; color: #374151; line-height: 1.6; }

    .remediation a { color: #3b6ef5; text-decoration: underline; }

    .code-block {
      background: #f1f5f9;
      border: 1px solid #e5e7eb;
      border-radius: 5px;
      padding: 8px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px; color: #374151;
      margin: 6px 0;
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
    }

    .btn-copy {
      font-family: inherit; font-size: 10px; font-weight: 600;
      padding: 3px 8px;
      background: #fff; border: 1px solid #d1d5db;
      border-radius: 4px; cursor: pointer; color: #374151;
      white-space: nowrap; flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-copy:hover { background: #f9fafb; }
    .btn-copy.copied { color: #16a34a; border-color: #bbf7d0; }

    .remediation-note {
      font-size: 11px; color: #6b7280;
      font-style: italic; margin-top: 8px;
    }

    /* ── Ready banner ── */
    .ready-banner {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 18px 24px;
      display: flex; align-items: center; gap: 16px;
    }

    .ready-icon {
      width: 36px; height: 36px;
      border-radius: 50%; background: #22c55e;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }

    .ready-text { flex: 1; }

    .ready-title { font-size: 14px; font-weight: 700; color: #166534; margin-bottom: 2px; }

    .ready-subtitle { font-size: 12px; color: #15803d; }
  </style>
</head>
<body>
<div class="startup-container">

  <div class="startup-header">
    <div class="startup-logo">M</div>
    <div class="startup-text">
      <div class="startup-title">MODAL</div>
      <div class="startup-subtitle">Archief browser — vereisten controleren...</div>
    </div>
  </div>

  <div class="phase-list" id="phase-list">
    <!-- Rendered by JS -->
  </div>

  <div class="ready-banner" id="ready-banner" style="display:none">
    <div class="ready-icon">✓</div>
    <div class="ready-text">
      <div class="ready-title">Voorbereidingen voltooid</div>
      <div class="ready-subtitle" id="ready-subtitle">Services worden opgestart...</div>
    </div>
  </div>

</div>
<script>
  const AGENT = '';
  const FRONTEND = 'http://localhost:4210';

  // ── Rendering ─────────────────────────────────────────────────────────────

  function iconHtml(status) {
    if (status === 'pending') return '<div class="status-dot"></div>';
    if (status === 'running') return '<div class="status-spinner"></div>';
    if (status === 'success') return '<div class="status-check">✓</div>';
    if (status === 'failed')  return '<div class="status-cross">✕</div>';
    return '';
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function copyBtn(text) {
    const id = 'copy-' + Math.random().toString(36).slice(2);
    setTimeout(() => {
      const btn = document.getElementById(id);
      if (btn) btn.addEventListener('click', () => {
        navigator.clipboard.writeText(text).then(() => {
          btn.textContent = 'Gekopieerd!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'Kopiëren'; btn.classList.remove('copied'); }, 2000);
        });
      });
    }, 0);
    return `<button class="btn-copy" id="${id}">Kopiëren</button>`;
  }

  function errorBlockHtml(phase) {
    let html = '<div class="error-block">';

    if (phase.detail) {
      html += `<div class="error-message">${escHtml(phase.detail)}</div>`;
    }

    // Port conflicts
    if (phase.errors && phase.errors.length > 0) {
      html += '<div class="remediation">';
      for (const err of phase.errors) {
        html += `<div style="margin-bottom:8px">${escHtml(err.message)}</div>`;
        html += `<div class="code-block"><span>${escHtml(err.fix)}</span>${copyBtn(err.fix)}</div>`;
      }
      html += '</div>';
    }

    // Install / docs link
    if (phase.link) {
      html += `<div class="remediation" style="margin-top:8px">
        Meer informatie: <a href="${escHtml(phase.link)}" target="_blank" rel="noopener">${escHtml(phase.link)}</a>
      </div>`;
    }

    // Special inline fix for docker_running on Linux
    if (phase.id === 'docker_running' && phase.status === 'failed') {
      const ua = navigator.platform || '';
      if (!ua.toLowerCase().includes('win')) {
        const cmd = 'sudo systemctl start docker';
        html += `<div class="remediation" style="margin-top:8px">Of voer het volgende uit:
          <div class="code-block"><span>${escHtml(cmd)}</span>${copyBtn(cmd)}</div>
        </div>`;
      }
    }

    html += '<div class="remediation-note">Start de applicatie opnieuw na het oplossen van het probleem.</div>';
    html += '</div>';
    return html;
  }

  function renderPhases(phases) {
    const list = document.getElementById('phase-list');
    list.innerHTML = '';

    for (const phase of phases) {
      // Phase row
      const row = document.createElement('div');
      row.className = 'phase-row';
      row.innerHTML =
        `<div class="status-icon">${iconHtml(phase.status)}</div>` +
        `<div class="phase-label">${escHtml(phase.label)}</div>` +
        (phase.status === 'success' && phase.detail
          ? `<div class="phase-detail">${escHtml(phase.detail)}</div>`
          : '') +
        (phase.status === 'running' && phase.detail
          ? `<div class="phase-detail">${escHtml(phase.detail)}</div>`
          : '');
      list.appendChild(row);

      // Error block (failed phase)
      if (phase.status === 'failed') {
        const block = document.createElement('div');
        block.innerHTML = errorBlockHtml(phase);
        list.appendChild(block.firstElementChild);
      }
    }
  }

  function allPhasesSucceeded(phases) {
    return phases.length > 0 && phases.every(p => p.status === 'success');
  }

  function anyPhaseFailed(phases) {
    return phases.some(p => p.status === 'failed');
  }

  // ── State handling ────────────────────────────────────────────────────────

  let prerequisitesDone = false;

  function onState(state) {
    if (!state || !state.phases) return;
    renderPhases(state.phases);

    if (allPhasesSucceeded(state.phases) && !prerequisitesDone) {
      prerequisitesDone = true;
      document.getElementById('ready-banner').style.display = 'flex';
      document.querySelector('.startup-subtitle').textContent = 'Vereisten geslaagd — services starten op...';
      pollBackend();
    }
  }

  // ── Backend health polling (redirect when app is ready) ───────────────────

  function pollBackend() {
    async function check() {
      try {
        const res = await fetch(AGENT + '/health/backend', { signal: AbortSignal.timeout(3000) });
        if (res.ok) {
          document.getElementById('ready-subtitle').textContent = 'Applicatie gereed! U wordt doorgestuurd...';
          setTimeout(() => { window.location.href = FRONTEND; }, 800);
          return;
        }
      } catch (_) {}
      setTimeout(check, 3000);
    }
    check();
  }

  // ── SSE connection with polling fallback ──────────────────────────────────

  function startPolling() {
    async function poll() {
      if (prerequisitesDone) return;
      try {
        const res = await fetch(AGENT + '/startup-status');
        const state = await res.json();
        onState(state);
        if (!anyPhaseFailed(state.phases || []) && !allPhasesSucceeded(state.phases || [])) {
          setTimeout(poll, 2000);
        }
      } catch (_) {
        setTimeout(poll, 2000);
      }
    }
    poll();
  }

  (function connect() {
    if (typeof EventSource === 'undefined') { startPolling(); return; }

    const sse = new EventSource(AGENT + '/startup-status/stream');

    sse.onmessage = (e) => {
      try {
        const state = JSON.parse(e.data);
        onState(state);
        if (anyPhaseFailed(state.phases || []) || allPhasesSucceeded(state.phases || [])) {
          sse.close();
        }
      } catch (_) {}
    };

    sse.onerror = () => {
      sse.close();
      if (!prerequisitesDone) startPolling();
    };
  })();
</script>
</body>
</html>
