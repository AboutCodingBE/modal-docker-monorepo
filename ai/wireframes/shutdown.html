<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODAL — Afsluiten knop</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: #f0f2f5;
          display: flex;
          padding: 40px;
        }

        .sidebar {
          width: 200px;
          background: #1a2744;
          border-radius: 10px;
          padding: 20px 0;
          color: #fff;
          display: flex;
          flex-direction: column;
          min-height: 400px;
        }

        .sidebar-logo {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 0 16px 24px;
        }

        .logo-badge {
          width: 32px;
          height: 32px;
          background: #3b6ef5;
          border-radius: 6px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 700;
          font-size: 14px;
        }

        .logo-text { font-weight: 700; font-size: 16px; letter-spacing: 0.05em; }

        .sidebar-nav {
          display: flex;
          flex-direction: column;
          gap: 4px;
          padding: 0 8px;
        }

        .nav-item {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 9px 12px;
          border-radius: 6px;
          font-size: 13px;
          color: rgba(255,255,255,0.65);
          cursor: pointer;
          transition: background 0.15s, color 0.15s;
        }

        .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
        .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .nav-item.active { background: #3b6ef5; color: #fff; }

        .sidebar-spacer { flex: 1; }

        .sidebar-bottom { padding: 0 8px; }

        .sidebar-divider {
          height: 1px;
          background: rgba(255,255,255,0.1);
          margin: 8px 4px 12px;
        }

        .btn-shutdown {
          display: flex;
          align-items: center;
          gap: 10px;
          width: 100%;
          padding: 9px 12px;
          border-radius: 6px;
          font-family: inherit;
          font-size: 13px;
          cursor: pointer;
          transition: background 0.15s, color 0.15s, border-color 0.15s;
          background: none;
          border: 1px solid rgba(59,110,245,0.4);
          color: rgba(255,255,255,0.65);
        }

        .btn-shutdown svg { width: 16px; height: 16px; flex-shrink: 0; }

        .btn-shutdown:hover {
          background: #3b6ef5;
          border-color: #3b6ef5;
          color: #fff;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-badge">M</div>
        <span class="logo-text">MODAL</span>
    </div>
    <nav class="sidebar-nav">
        <a class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
            Archieven
        </a>
        <a class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            Zoeken
        </a>
        <a class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            Configuratie
        </a>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-bottom">
        <div class="sidebar-divider"></div>
        <button class="btn-shutdown">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            Afsluiten
        </button>
    </div>
</div>

</body>
</html>
