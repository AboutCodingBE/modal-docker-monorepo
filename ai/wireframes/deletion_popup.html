<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODAL — Archief Verwijderen</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: #f0f2f5;
          color: #111827;
          padding: 40px;
          display: flex;
          justify-content: center;
        }

        .modal {
          background: #fff;
          border: 1px solid #e5e7eb;
          border-radius: 12px;
          width: 420px;
          box-shadow: 0 20px 60px rgba(0,0,0,0.15);
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .modal-body { padding: 24px 24px 20px; }

        .modal-title {
          font-size: 16px;
          font-weight: 700;
          color: #111827;
          margin-bottom: 8px;
        }

        .modal-message {
          font-size: 13px;
          color: #6b7280;
          line-height: 1.6;
        }

        .archive-name-highlight {
          font-weight: 700;
          color: #111827;
        }

        .modal-footer {
          display: flex;
          align-items: center;
          justify-content: flex-end;
          gap: 8px;
          padding: 16px 24px 20px;
          border-top: 1px solid #f3f4f6;
        }

        .btn-cancel {
          font-family: inherit;
          font-size: 13px;
          font-weight: 500;
          padding: 9px 18px;
          background: #fff;
          border: 1px solid #d1d5db;
          border-radius: 6px;
          cursor: pointer;
          color: #374151;
          transition: background 0.15s;
        }

        .btn-cancel:hover { background: #f9fafb; }

        .btn-delete {
          font-family: inherit;
          font-size: 13px;
          font-weight: 700;
          padding: 9px 18px;
          background: #ef4444;
          color: #fff;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          transition: background 0.15s;
        }

        .btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="modal">
    <div class="modal-body">
        <div class="modal-title">Archief verwijderen</div>
        <div class="modal-message">
            Weet u zeker dat u <span class="archive-name-highlight">karl-test4</span> permanent wilt verwijderen? Lopende analyses worden geannuleerd. Dit kan niet ongedaan worden gemaakt.
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn-cancel">Annuleren</button>
        <button class="btn-delete">Verwijderen</button>
    </div>
</div>

</body>
</html>
