[pytest]
markers =
    benchmark: performance-benchmark (tests/performance/) — meet snelheid, geen correctheid.
        Draai apart met: pytest tests/performance/ -m benchmark
    slow: langlopende test — draait niet mee in de standaard run.

# Normale runs (CI: pytest tests/) sluiten benchmarks standaard uit.
# Expliciet -m benchmark op de commandline overschrijft dit (zie tests/performance/README.md).
addopts = -m "not benchmark"
