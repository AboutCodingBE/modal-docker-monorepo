name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install pyinstaller

      - name: Build binary
        run: |
          cd agent
          pyinstaller --onefile --name archive-agent --add-data "config.json:." agent.py

      - name: Make binary executable
        run: chmod +x agent/dist/archive-agent

      - name: Stage release files
        run: |
          mkdir release-staging
          cp agent/dist/archive-agent release-staging/archive-agent
          cp docker-compose.prod.yml release-staging/docker-compose.prod.yml
          cp README-RELEASE.md release-staging/README-RELEASE.md
          cp diagnostic.sh release-staging/diagnostic.sh
          chmod +x release-staging/diagnostic.sh
          echo '{"agent_port":9090,"frontend_url":"http://localhost:4210","compose_file":"docker-compose.prod.yml","log_file":"~/.archive-app/agent.log"}' > release-staging/config.json
          cd release-staging && zip ../archive-app-linux.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-app-linux.zip
          path: archive-app-linux.zip

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install pyinstaller

      - name: Build arm64 binary
        run: |
          cd agent
          pyinstaller --onefile --name archive-agent-arm64 --add-data "config.json:." agent.py

      - name: Upload arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-binary
          path: agent/dist/archive-agent-arm64

  build-macos-x86_64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install pyinstaller

      - name: Build x86_64 binary
        run: |
          cd agent
          pyinstaller --onefile --name archive-agent-x86_64 --add-data "config.json:." agent.py

      - name: Upload x86_64 binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-binary
          path: agent/dist/archive-agent-x86_64

  package-macos:
    needs: [build-macos-arm64, build-macos-x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-binary
          path: binaries/

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-binary
          path: binaries/

      - name: Create universal binary
        run: |
          lipo -create \
            binaries/archive-agent-arm64 \
            binaries/archive-agent-x86_64 \
            -output archive-agent
          chmod +x archive-agent
          echo "Universal binary architectures:"
          lipo -info archive-agent

      - name: Stage release files
        run: |
          mkdir release-staging
          cp archive-agent release-staging/archive-agent
          cp docker-compose.prod.yml release-staging/docker-compose.prod.yml
          cp README-RELEASE.md release-staging/README-RELEASE.md
          cp diagnostic.sh release-staging/diagnostic.sh
          chmod +x release-staging/diagnostic.sh
          echo '{"agent_port":9090,"frontend_url":"http://localhost:4210","compose_file":"docker-compose.prod.yml","log_file":"~/.archive-app/agent.log"}' > release-staging/config.json
          cd release-staging && zip ../archive-app-macos.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-app-macos.zip
          path: archive-app-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install pyinstaller

      - name: Build binary
        run: |
          cd agent
          pyinstaller --onefile --name archive-agent --add-data "config.json;." agent.py

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-staging
          Copy-Item agent/dist/archive-agent.exe release-staging/archive-agent.exe
          Copy-Item docker-compose.prod.yml release-staging/docker-compose.prod.yml
          Copy-Item README-RELEASE.md release-staging/README-RELEASE.md
          Copy-Item diagnostic.ps1 release-staging/diagnostic.ps1
          '{"agent_port":9090,"frontend_url":"http://localhost:4210","compose_file":"docker-compose.prod.yml","log_file":"~/.archive-app/agent.log"}' | Out-File -FilePath release-staging/config.json -Encoding utf8
          Compress-Archive -Path release-staging/* -DestinationPath archive-app-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-app-windows.zip
          path: archive-app-windows.zip

  release:
    needs: [build-linux, package-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            archive-app-linux.zip
            archive-app-macos.zip
            archive-app-windows.zip